# SPDX-License-Identifier: Apache-2.0
# Variant of `scenarios/memory_concurrent_writers.yaml` with one setting changed:
#     task.config.rounds: 20 -> 5
#
# See README.md.
name: memory_concurrent_writers_rounds
description: "Same 8 writers, but 5 gossip rounds instead of 20."

tier: 1
seed: 42

agents:
  count: 8
  brain: state-machine
  roles:
    - name: writer
      count: 8

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: lww_register
  privacy: noop
  datafacts: datafacts_v1

task:
  type: memory_concurrent_writers
  config:
    rounds: 5
    key: shared

failures:
  message_drop: 0.1

duration: "ticks: 100000"

metrics:
  - message_count
  - agent_count

output:
  trace: ./traces/memory_concurrent_writers_rounds.jsonl
